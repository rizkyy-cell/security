<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login-Admin.id</title>
    <style>
        /* Reset margin & font */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Background gelap pekat */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #0b0f19; 
            overflow: hidden; 
        }

        /* Canvas untuk animasi partikel bintik-bintik */
        #particles-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* Kotak login efek kaca */
        .login-box {
            position: relative;
            z-index: 1;
            background: rgba(25, 30, 45, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 50px 40px;
            width: 360px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            color: #fff;
        }

        .login-box h2 {
            text-align: center;
            margin-bottom: 5px;
            font-size: 26px;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: linear-gradient(to right, #00d2ff, #3a7bd5);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .login-box p.subtitle {
            text-align: center;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 35px;
            letter-spacing: 0.5px;
        }

        /* Form styling */
        .input-group {
            position: relative;
            margin-bottom: 30px;
        }

        .input-group input {
            width: 100%;
            padding: 10px 0;
            font-size: 16px;
            color: #fff;
            background: transparent;
            border: none;
            border-bottom: 2px solid rgba(255, 255, 255, 0.2);
            outline: none;
            transition: 0.3s;
        }

        .input-group label {
            position: absolute;
            top: 10px;
            left: 0;
            font-size: 16px;
            color: rgba(255, 255, 255, 0.5);
            pointer-events: none;
            transition: 0.3s;
        }

        .input-group input:focus ~ label,
        .input-group input:valid ~ label {
            top: -20px;
            left: 0;
            color: #00d2ff;
            font-size: 13px;
            font-weight: 600;
        }

        .input-group input:focus,
        .input-group input:valid {
            border-bottom: 2px solid #00d2ff;
        }

        /* Tombol login */
        button {
            width: 100%;
            background: linear-gradient(to right, #00d2ff, #0066ff);
            border: none;
            padding: 14px;
            border-radius: 8px;
            color: #fff;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 210, 255, 0.2);
            margin-top: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 210, 255, 0.4);
        }
        
        /* Teks daftar / bawah */
        .register-link {
            text-align: center;
            margin-top: 25px;
            font-size: 13px;
        }

        .register-link a {
            color: #00d2ff;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }

        .register-link a:hover {
            text-decoration: underline;
        }

        /* Pesan notifikasi */
        #login-message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            min-height: 20px;
        }
        .success { color: #00ff88; }
        .error { color: #ff3366; }

        /* ========================================= */
        /* STYLING POP-UP (MODAL) MINTA AKSES        */
        /* ========================================= */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        /* Class untuk menampilkan pop-up */
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-content {
            background: rgba(25, 30, 45, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 30px;
            width: 320px;
            text-align: center;
            position: relative;
            transform: translateY(-30px); /* Efek muncul dari atas */
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
            color: #fff;
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }

        /* Tombol silang (X) */
        .close-btn {
            position: absolute;
            top: 12px;
            right: 15px;
            font-size: 24px;
            color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: 0.3s;
            font-weight: bold;
        }

        .close-btn:hover {
            color: #ff3366;
        }

        .modal-content h3 {
            margin-bottom: 10px;
            color: #00d2ff;
            font-size: 20px;
        }

        .modal-content p {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 25px;
            line-height: 1.5;
        }

        /* Tombol sosial media */
        .modal-links {
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .modal-links a {
            flex: 1;
            padding: 10px 0;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            color: #fff;
            transition: 0.3s;
        }

        .btn-wa {
            background: #25D366; /* Warna khas WhatsApp */
        }

        .btn-wa:hover {
            background: #128C7E;
            box-shadow: 0 5px 15px rgba(37, 211, 102, 0.4);
            transform: translateY(-2px);
        }

        .btn-ig {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); /* Gradien IG */
        }

        .btn-ig:hover {
            box-shadow: 0 5px 15px rgba(220, 39, 67, 0.4);
            filter: brightness(1.1);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <canvas id="particles-canvas"></canvas>

    <div class="login-box">
        <h2>AIDMN Panel</h2>
        <p class="subtitle">Secure Access Only</p>
        
        <form id="loginForm">
            <div class="input-group">
                <input type="text" id="username" required autocomplete="off">
                <label>Username</label>
            </div>
            <div class="input-group">
                <input type="password" id="password" required>
                <label>Password</label>
            </div>
            
            <button type="submit">Login</button>
            
            <div id="login-message"></div>

            <div class="register-link">
                <p>Belum punya akses? <a id="btn-minta-akses">Minta Akses</a></p>
            </div>
        </form>
    </div>

    <div id="popupModal" class="modal-overlay">
        <div class="modal-content">
            <span class="close-btn" id="closeModal">&times;</span>
            <h3>Peringatan</h3>
            <p>Segera hubungi admin untuk tindakan lebih lanjut.</p>
            <div class="modal-links">
                <a href="https://wa.me/6281234567890" target="_blank" class="btn-wa">WhatsApp</a>
                
                <a href="https://instagram.com/username_kamu" target="_blank" class="btn-ig">Instagram</a>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // PENGATURAN DATA LOGIN & REDIRECT
        // ==========================================
        const TARGET_USERNAME = "rizky kurniawan";
        const TARGET_PASSWORD = "9999";
        const REDIRECT_URL = "https://rizkyy-cell.github.io/portofolio/";

        // Logika Login
        document.getElementById("loginForm").addEventListener("submit", function(event) {
            event.preventDefault();
            
            const inputUser = document.getElementById("username").value;
            const inputPass = document.getElementById("password").value;
            const messageEl = document.getElementById("login-message");

            if (inputUser === TARGET_USERNAME && inputPass === TARGET_PASSWORD) {
                messageEl.textContent = "✅ Login Berhasil! Mengalihkan...";
                messageEl.className = "success";
                
                setTimeout(() => {
                    window.location.href = REDIRECT_URL;
                }, 1000);
            } else {
                messageEl.textContent = "❌ Username atau Password salah!";
                messageEl.className = "error";
            }
        });

        // ==========================================
        // LOGIKA POP-UP MINTA AKSES
        // ==========================================
        const btnMintaAkses = document.getElementById('btn-minta-akses');
        const popupModal = document.getElementById('popupModal');
        const closeModal = document.getElementById('closeModal');

        // Saat tulisan "Minta Akses" diklik
        btnMintaAkses.addEventListener('click', function() {
            popupModal.classList.add('active');
        });

        // Saat tombol silang "X" diklik
        closeModal.addEventListener('click', function() {
            popupModal.classList.remove('active');
        });

        // Opsional: Tutup pop-up jika user klik area gelap di luar kotak pop-up
        window.addEventListener('click', function(event) {
            if (event.target === popupModal) {
                popupModal.classList.remove('active');
            }
        });

        // ==========================================
        // ANIMASI PARTIKEL (CANVAS)
        // ==========================================
        const canvas = document.getElementById("particles-canvas");
        const ctx = canvas.getContext("2d");
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particlesArray = [];
        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.size = Math.random() * 2 + 0.5;
                this.speedX = (Math.random() * 0.8) - 0.4;
                this.speedY = (Math.random() * 0.8) - 0.4;
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
                if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
            }
            draw() {
                ctx.fillStyle = "rgba(0, 210, 255, 0.3)";
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function init() {
            particlesArray = [];
            let count = (canvas.height * canvas.width) / 10000;
            for (let i = 0; i < count; i++) particlesArray.push(new Particle());
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let p of particlesArray) {
                p.update();
                p.draw();
            }
            requestAnimationFrame(animate);
        }

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            init();
        });

        init();
        animate();
    </script>
</body>
</html>
